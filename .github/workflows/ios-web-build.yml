name: iOS Web build
on:
  push:
    branches: [ios-web]
  pull_request:
    branches: [ios-web]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
